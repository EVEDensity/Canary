changelog:
  exclude:
    labels: [skip-changelog]
  categories:
    - title: "New features / 新功能"
      labels: [enhancement, feature]
    - title: "Fixes / 修复"
      labels: [bug, fix]
    - title: "Documentation / 文档"
      labels: [documentation]
    - title: "Other changes / 其他更新"
      labels: ["*"]
