name: Platform checks
on:
  workflow_dispatch:
  pull_request:
    paths:
      [
        "packages/**",
        "apps/**",
        "integrations/fixtures/**",
        "scripts/verify-r6.mjs",
        "scripts/lib/**",
        "scripts/run-logged.mjs",
        ".github/workflows/r6.yml",
        "pnpm-lock.yaml",
      ]
permissions:
  contents: read
jobs:
  verify:
    name: ${{ matrix.platform }} / Node 24
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: Windows
          - os: ubuntu-latest
            platform: Ubuntu
          - os: macos-latest
            platform: macOS
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm verify:r6
        env:
          CANARY_R6_CONTEXT: github-actions-${{ matrix.os }}
          CANARY_R6_EXPORT: "1"
          CANARY_R6_OUTPUT: r6-evidence/result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r6-${{ matrix.os }}-node24
          path: |
            r6-evidence/
            .canary/logs/verification/r6/
          include-hidden-files: true
          if-no-files-found: error

  summary:
    name: All platforms / Node 24
    needs: verify
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate platform results
        env:
          PLATFORM_RESULT: ${{ needs.verify.result }}
        shell: bash
        run: |
          echo "## Node 24 platform compatibility" >> "$GITHUB_STEP_SUMMARY"
          echo "Windows, Ubuntu and macOS: **$PLATFORM_RESULT**" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$PLATFORM_RESULT" != "success" ]]; then
            echo "Platform validation did not complete successfully. Inspect the individual platform jobs." >&2
            exit 1
          fi
