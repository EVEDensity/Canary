name: Canary website

on:
  push:
    branches: [main]
    paths:
      - "apps/site/**"
      - "docs/images/dashboard-en.jpg"
      - "docs/images/dashboard-zh-CN.jpg"
      - "apps/web/assets/fonts/inter-latin-wght-normal.woff2"
      - "apps/web/assets/fonts/inter-OFL.txt"
      - "apps/web/LUCIDE-LICENSE.txt"
      - "LICENSE"
      - ".github/workflows/site.yml"
  pull_request:
    paths:
      - "apps/site/**"
      - "docs/images/dashboard-en.jpg"
      - "docs/images/dashboard-zh-CN.jpg"
      - "apps/web/assets/fonts/inter-latin-wght-normal.woff2"
      - "apps/web/assets/fonts/inter-OFL.txt"
      - "apps/web/LUCIDE-LICENSE.txt"
      - "LICENSE"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: canary-site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build static website
        run: node apps/site/scripts/build.mjs
      - name: Configure Pages
        if: ${{ vars.CANARY_PAGES_ENABLED == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        if: ${{ vars.CANARY_PAGES_ENABLED == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-pages-artifact@v4
        with:
          path: apps/site/dist

  deploy:
    if: ${{ vars.CANARY_PAGES_ENABLED == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
