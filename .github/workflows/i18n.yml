name: Translation contracts
on:
  pull_request:
    paths: ["apps/web/**", "scripts/i18n.mjs", ".github/workflows/i18n.yml"]
  push:
    branches: [main, master]
    paths: ["apps/web/**", "scripts/i18n.mjs", ".github/workflows/i18n.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  translations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm i18n:check
