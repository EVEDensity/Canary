name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: format / lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint

  test:
    name: Node 24
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - name: Preserve failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: node24-failure-logs
          path: .canary/logs/tests/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: ignore

  process-platform:
    name: process adapter / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @canary/runner... build
      - run: pnpm --filter @canary/isolation exec vitest run tests/process.test.ts
      - name: Verify runner descendant cleanup
        run: pnpm --filter @canary/runner exec vitest run tests/r1-stability.test.ts -t "R1 descendant termination"

  # Dedicated job: fixture matrix is not folded into `pnpm test`.
  coverage-fixture:
    name: coverage fixture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Coverage collector fixture matrix
        run: pnpm --filter @canary/coverage exec vitest run tests/coverage-fixtures.test.ts

  demo:
    name: Demo ${{ matrix.demo.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        demo:
          - name: local-agent
            command: pnpm demo:headless
            assert_junit: true
          - name: mcp-agent
            command: pnpm --filter @canary/cli canary run --headless --no-open --config examples/mcp-agent/canary.config.ts
            assert_junit: false
          - name: loop-agent
            command: pnpm --filter @canary/cli canary run --headless --no-open --config examples/loop-agent/canary.config.ts
            assert_junit: false
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Headless ${{ matrix.demo.name }}
        run: ${{ matrix.demo.command }}
      - name: Assert JUnit failures are zero
        if: ${{ matrix.demo.assert_junit }}
        run: node scripts/assert-junit.mjs

  bun-smoke:
    name: Bun smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: pnpm install --frozen-lockfile
      - name: CLI help under Bun
        run: |
          output=$(bun ./packages/cli/src/index.ts help)
          echo "$output"
          echo "$output" | grep -F "Usage: canary run"
      - name: Confirm V8 coverage is not claimed on Bun
        run: bun -e "if (typeof Bun === 'undefined') throw new Error('not bun')"

  pack:
    name: release pack smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: node scripts/verify-pack.mjs
