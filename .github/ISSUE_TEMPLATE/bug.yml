name: Bug report
description: Unexpected canary behavior, failed run, or incorrect coverage/UI
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Please include a local reproduction. Do not attach unredacted traces or secrets.
  - type: textarea
    id: summary
    attributes:
      label: What happened
      description: One or two sentences.
    validations:
      required: true
  - type: textarea
    id: expect
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: Commands, canary.config.ts excerpt, and Adapter kind (function / http / mcp).
      value: |
        ```powershell
        pnpm canary -- run --headless --no-open
        ```
    validations:
      required: true
  - type: input
    id: runid
    attributes:
      label: Run id
      placeholder: run_…
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - CLI
        - Coverage
        - Runner / adapters
        - Web UI / SSE
        - Evaluators / gates
        - Improvement loop
        - Docs / CI
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
      placeholder: "24"
